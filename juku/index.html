<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>学習塾の統合管理システム（体験版）</title>
<link rel="icon" href="../assets/favicon.svg">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  html,body{height:100%}
  body{
    margin:0;display:flex;flex-direction:column;background:#eef1f5;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  }
  .ss-bar{flex:0 0 auto}

  /* ---------- 画面えらび ---------- */
  .pick{
    flex:0 0 auto;background:#fff;border-bottom:1px solid #dde2e8;
    padding:9px 12px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
  }
  .pick::-webkit-scrollbar{display:none}
  .pick button{
    flex:0 0 auto;font-family:inherit;font-size:13px;font-weight:700;
    padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;
    border:1px solid #d5dbe2;background:#f7f9fb;color:#3d4750;line-height:1.3;
  }
  .pick button:hover{background:#eef2f6}
  .pick button[aria-pressed="true"]{background:#12181f;border-color:#12181f;color:#fff}
  .pick .who{
    display:flex;align-items:center;gap:6px;margin-left:auto;flex:0 0 auto;
    font-size:12px;color:#6b747d;padding-left:10px;
  }

  /* ---------- いま見ている画面の説明 ---------- */
  .lead{
    flex:0 0 auto;background:#fbfcfd;border-bottom:1px solid #e6eaee;
    padding:10px 14px;font-size:12.5px;line-height:1.7;color:#4a545e;
  }
  .lead b{color:#1f2328}
  .lead .tip{color:#8a939c}

  /* ---------- 画面そのもの ---------- */
  .stage{flex:1 1 auto;min-height:0;position:relative;background:#f0f8ff}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#8a939c;font-size:13px;background:#f0f8ff;
  }
  .loading[hidden]{display:none}
</style>
</head>
<body>
<script src="../assets/demo.js"></script>

<nav class="pick" id="pick" aria-label="見る画面をえらぶ"></nav>
<p class="lead" id="lead"></p>
<div class="stage">
  <div class="loading" id="loading">読み込み中…</div>
  <iframe id="app" title="学習塾システムの体験版"></iframe>
</div>

<script>
/* 体験版で見せる画面。src は本番のコードをそのまま書き出したもの（juku/app/ の中） */
var SCREENS = [
  {
    key: 'quiz', label: '🎮 生徒の画面',
    src: 'app/quiz/?school=demo&name=' + encodeURIComponent('たいち'),
    lead: '<b>生徒が家や教室でひらく画面です。</b>「そら塾」の中2「たいち」としてログインした状態にしてあります。'
        + 'カリキュラムの「江戸時代を4段でしあげる」を開くと、①をクリアするまで②が開かないのが見えます。'
        + '一番下の「自習エリア」は、学年（中2）→ 教科（社会）の順にタップするとコースが出ます。'
        + '<span class="tip">（クイズは最後まで遊べます。タイマー・ミス・ランキングも本物と同じ動きです）</span>'
  },
  {
    key: 'admin', label: '📚 教材をつくる',
    src: 'app/admin/',
    lead: '<b>塾の先生がコースを作る画面です。</b>「どの学年の・どの単元の問題を・何問・何秒で」を選ぶと、'
        + 'その条件に合う問題が下にプレビューされ、配信した時点の問題と順番が固定されます。'
        + '<span class="tip">（あとから問題を足しても、配信済みのコースの中身は変わりません）</span>'
  },
  {
    key: 'analytics', label: '📊 つまずきを見る',
    src: 'app/admin/analytics/',
    lead: '<b>授業がはじまる前に、誰がどこで詰まっているかを見る画面です。</b>'
        + '塾全体の弱点タグ、コースごとのクリア状況、単語の習得状況が出ます。'
        + '<span class="tip">（弱点は「延べ回数」ではなく「まだ克服できていない人数」で並べています）</span>'
  },
  {
    key: 'booking', label: '📅 予約をさばく',
    src: 'app/admin/booking/',
    lead: '<b>毎週の固定枠と、生徒が自分で取る振替を1つの表で見る画面です。</b>'
        + '「当月分を一括生成」を押すと、固定枠から1か月ぶんの予約が実際に作られます（休講日は飛ばします）。'
        + '<span class="tip">（Googleカレンダー連携は本番だけの機能です。押すと断りが出ます）</span>'
  },
  {
    key: 'teacher', label: '🖨️ プリントを出す',
    src: 'app/teacher/',
    lead: '<b>同じ問題を紙でも出せるようにした画面です。</b>コースを選ぶと、問題プリント・解答・'
        + 'まとめノートの体裁で印刷できます。'
        + '<span class="tip">（画面で解いた記録と紙の丸つけを、同じ生徒の記録としてつなげるための入口です）</span>'
  },
  {
    key: 'billing', label: '💰 請求をつくる',
    src: 'app/admin/billing/',
    lead: '<b>毎月の月謝を計算して、保護者へ送る文面まで作る画面です。</b>'
        + '兄弟の合算、助成カード、紹介割引、入塾月の週割りを差し引いた金額が自動で出て、'
        + 'そのままLINEに貼れる文章になります。「←先月」で過去の月も見られます。'
        + '<span class="tip">（生徒・金額はすべて架空です。過去の月は請求した時点の金額のまま固定され、'
        + '料金を改定してもさかのぼって変わりません）</span>'
  },
  {
    key: 'hp', label: '🌐 ホームページ',
    src: 'app/demo/',
    lead: '<b>同じ塾のホームページです。</b>料金表・よくある質問・お問い合わせまで入った1ページで、'
        + 'スマホでも崩れないように作ってあります。検索結果に出るための情報（構造化データ）も入っています。'
        + '<span class="tip">（塾名・人物・経歴・所在地はすべて架空です。写真はフリー素材サイト「ぱくたそ」の素材を使っています）</span>'
  }
];

var pick = document.getElementById('pick');
var lead = document.getElementById('lead');
var app = document.getElementById('app');
var loading = document.getElementById('loading');
var current = null;

SCREENS.forEach(function (s) {
  var b = document.createElement('button');
  b.type = 'button';
  b.textContent = s.label;
  b.setAttribute('aria-pressed', 'false');
  b.onclick = function () { show(s.key, true); };
  b.dataset.key = s.key;
  pick.appendChild(b);
});

var who = document.createElement('span');
who.className = 'who';
who.textContent = '架空の塾「そら塾」／生徒8名';
pick.appendChild(who);

function show(key, push) {
  var s = SCREENS.filter(function (x) { return x.key === key; })[0] || SCREENS[0];
  current = s.key;
  [].forEach.call(pick.querySelectorAll('button'), function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.key === s.key));
  });
  lead.innerHTML = s.lead;
  loading.hidden = false;
  app.src = s.src;
  if (push) history.replaceState(null, '', '?screen=' + s.key);
}

app.addEventListener('load', function () { loading.hidden = true; });

/* 「最初から」で、体験版の中で触った結果を消す。
   中の画面は同じ場所から配信しているので、親から中の保存先に手が届く。 */
function resetInside() {
  try {
    var w = app.contentWindow;
    w.sessionStorage.removeItem('ssdemo:juku');
    w.localStorage.removeItem('admin_school_id');
    w.localStorage.removeItem('admin_school_name');
    w.localStorage.removeItem('demo_school_id');
  } catch (e) { /* 読み込み前などは、次の再読込で作り直される */ }
}

Demo.init({
  home: '../taiken/',
  note: 'これは<b>体験版</b>です。生徒名・成績・予約はすべて架空で、実在の塾のデータにはつながっていません。',
  about: {
    title: '学習塾の「授業以外」を1つにまとめたシステム',
    sub: '自分の塾のために作り、半年以上、実際の生徒・保護者・スタッフが毎日使っています。',
    points: [
      { t: 'ゲームにしたのは、続けさせるため',
        d: '中学生は「復習しなさい」では復習しません。タイムを競う形にして、クリアすると次が開く順番を作ると、言われなくても開くようになります。ランキングは塾の中だけに出ます。' },
      { t: '同じ12問を、4回まわす',
        d: '「江戸時代を4段でしあげる」は、①順番どおりの4択 →②順番どおりの並べかえ →③バラバラの4択 →④バラバラの並べかえ、と形だけを変えて同じ問題を4周します。むずかしさの段差を測って、1段ずつなだらかにしてあります。' },
      { t: 'つまずきは、授業がはじまる前に分かる',
        d: '誰がどの問題を何回まちがえたかが自動で貯まるので、先生は「今日この子に何をさせるか」を教室に入る前に決められます。まちがえた問題だけを出す「弱点特訓」もそこから作られます。' },
      { t: '触った結果はどこにも残りません',
        d: 'この体験版はブラウザの中だけで動いていて、本番のデータベースには一切つながっていません。何を押しても、実在の塾の記録は変わりません。「最初から」でいつでも元に戻せます。' }
    ]
  }
});

/* 帯の「最初から」を、中の画面まで戻すように差し替える */
var resetBtn = document.querySelector('.ss-reset');
if (resetBtn) {
  resetBtn.addEventListener('click', function (e) {
    e.stopImmediatePropagation();
    resetInside();
    Demo.clearAll();
    show(current || 'quiz', false);
  }, true);
}

show(new URLSearchParams(location.search).get('screen') || 'quiz', false);
</script>
</body>
</html>
